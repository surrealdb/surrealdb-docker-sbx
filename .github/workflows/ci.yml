# Validates the kit on every pull request: the spec parses and still holds its
# documented contract, and the scripts that run inside the sandbox are clean.
#
# `sbx kit validate` is deliberately not run here — it requires a Docker login,
# which CI has no credentials for. These are the checks that can be made
# without authenticating.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate kit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # shellcheck ships preinstalled on ubuntu-latest runners.
      - name: Lint shell scripts
        run: shellcheck files/home/.local/bin/*.sh scripts/*.sh

      - name: Install spec check dependencies
        run: pip install --quiet pyyaml

      - name: Validate spec.yaml
        run: python3 .github/scripts/check-spec.py
